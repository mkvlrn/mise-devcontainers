name: validate

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      distros: ${{ steps.changes.outputs.distros }}
      candidate-tag: ${{ steps.changes.outputs.candidate_tag }}
      image-version: ${{ steps.changes.outputs.image_version }}
    steps:
      - name: setup checkout action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: test publishing logic
        run: ./test/publish-template-test.sh

      - name: detect changes
        id: changes
        run: ./scripts/detect-changes.sh

      - name: save validation metadata
        run: |
          ./scripts/save-validation.sh \
            --distros '${{ steps.changes.outputs.distros }}' \
            --candidateTag "${{ steps.changes.outputs.candidate_tag }}" \
            --imageVersion "${{ steps.changes.outputs.image_version }}" \
            --headSha "${{ github.event.pull_request.head.sha }}"

      - name: upload validation metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: validation-metadata
          path: .tmp/.validation-metadata
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  build-image:
    needs: detect-changes
    if: needs.detect-changes.outputs.distros != '[]'
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(needs.detect-changes.outputs.distros) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: setup checkout action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: setup buildx action
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: login to ghcr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
        run: ./scripts/login-ghcr.sh

      - name: build candidate image
        env:
          MISE_GITHUB_TOKEN: ${{ secrets.MISE_GITHUB_TOKEN }}
        run: |
          ./scripts/build-image.sh \
            --distro "${{ matrix.distro }}" \
            --candidateTag "${{ needs.detect-changes.outputs.candidate-tag }}"

  create-template:
    needs:
      - detect-changes
      - build-image
    if: needs.detect-changes.outputs.distros != '[]'
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(needs.detect-changes.outputs.distros) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: setup checkout action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: create template
        run: |
          ./scripts/create-template.sh \
            --distro "${{ matrix.distro }}" \
            --candidateTag "${{ needs.detect-changes.outputs.candidate-tag }}" \
            --imageVersion "${{ needs.detect-changes.outputs.image-version }}"

      - name: upload template artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: template-${{ matrix.distro }}
          path: .tmp/.publish-template-${{ matrix.distro }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30

  test-template:
    needs:
      - detect-changes
      - create-template
    if: needs.detect-changes.outputs.distros != '[]'
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(needs.detect-changes.outputs.distros) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: setup checkout action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: install dev container cli
        run: npm install -g @devcontainers/cli

      - name: login to ghcr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
        run: ./scripts/login-ghcr.sh

      - name: download template artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: template-${{ matrix.distro }}
          path: .tmp/.publish-template-${{ matrix.distro }}

      - name: test template
        run: ./scripts/test-template.sh --distro "${{ matrix.distro }}"

  validation:
    needs:
      - detect-changes
      - build-image
      - create-template
      - test-template
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: setup checkout action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: check validation result
        env:
          DETECT_CHANGES_RESULT: ${{ needs.detect-changes.result }}
          BUILD_IMAGE_RESULT: ${{ needs.build-image.result }}
          CREATE_TEMPLATE_RESULT: ${{ needs.create-template.result }}
          TEST_TEMPLATE_RESULT: ${{ needs.test-template.result }}
        run: ./scripts/validation-result.sh
