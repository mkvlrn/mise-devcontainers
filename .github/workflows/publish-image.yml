name: Publish Image

on:
  workflow_dispatch:
  pull_request:
    types:
      - closed

jobs:
  changes:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.merged == true &&
        github.event.pull_request.user.login == 'renovate[bot]'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      distros: ${{ steps.changes.outputs.distros }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - id: changes
        shell: bash
        run: |
          all_distros() {
            find distros -mindepth 1 -maxdepth 1 -type d -printf '"%f"\n' | paste -sd, -
          }

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "distros=[$(all_distros)]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git diff --name-only \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.merge_commit_sha }}" \
            > /tmp/changed-files

          if grep -q '^common/' /tmp/changed-files; then
            echo "distros=[$(all_distros)]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          DISTROS=()

          while IFS= read -r distro; do
            if grep -q "^distros/${distro}/" /tmp/changed-files; then
              DISTROS+=("$distro")
            fi
          done < <(find distros -mindepth 1 -maxdepth 1 -type d -printf '%f\n')

          if (( ${#DISTROS[@]} == 0 )); then
            echo 'distros=[]' >> "$GITHUB_OUTPUT"
          else
            printf -v JSON '"%s",' "${DISTROS[@]}"
            echo "distros=[${JSON%,}]" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: changes
    if: needs.changes.outputs.distros != '[]'
    strategy:
      fail-fast: false
      matrix:
        distro: ${{ fromJSON(needs.changes.outputs.distros) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build and push ${{ matrix.distro }}
        env:
          MISE_GITHUB_TOKEN: ${{ secrets.MISE_GITHUB_TOKEN }}
        run: ./build.sh --distro "${{ matrix.distro }}" --push
