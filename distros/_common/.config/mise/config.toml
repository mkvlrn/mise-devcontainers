[tools]
"github:o2sh/onefetch" = "3.1.0"
eza = "0.23.5"
fastfetch = "2.70.0"
github-cli = "2.103.2"
jq = "1.8.2"
usage = "7.1.2"
oh-my-posh = "31.9.1"

[settings]
minimum_release_age = "1d"
disable_backends = ["asdf"]
trusted_config_paths = ["/code"]
use_versions_host = false
fetch_remote_versions_cache = "1h"
color_theme = "catppuccin"
go.set_gobin = false
go.set_goroot = false
