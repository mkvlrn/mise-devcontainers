[lint]
description = "Check shell scripts with shellcheck"
run = """
mise exec -- shellcheck -x scripts/*.sh test/_common/*.sh test/*/*.sh test/publish-template-test.sh
"""

[lint-fix]
description = "Format shell scripts with shfmt"
run = """
mise exec -- shfmt -w scripts test
"""

[test]
description = "Run test suite"
run = """
./test/publish-template-test.sh
"""

[sync-branch]
description = "Sync tool versions"
run = """
mise install
mise prune -y
"""

[rebuild-all]
description = "Open a PR that rebuilds all distro images"
run = """
set -euo pipefail

if [ -n "$(git status --porcelain)" ]; then
  echo "working tree has uncommitted changes; refusing to create rebuild PR" >&2
  exit 1
fi

git fetch origin main
branch="rebuild-all-$(date -u +%Y%m%d-%H%M%S)"
git switch --create "$branch" origin/main

date -u +%Y-%m-%dT%H:%M:%SZ > .rebuild-all

git add .rebuild-all
git commit -m "chore: rebuild all distros"
git push --set-upstream origin "$branch"
gh pr create --base main --head "$branch" --title "chore: rebuild all distros" --body "Trigger a full rebuild of all distro images and templates."
git switch main
git branch --delete --force "$branch"
"""
