[commit-msg.commands]
cog-lint = { run = "mise exec -- cog verify --file {1}" }

[pre-commit.commands]
lint = { glob = "*.sh", run = "shellcheck -x {staged_files}" }

[pre-push.commands]
lint = { run = "mise run lint" }
test = { run = "mise run test" }

[post-checkout.commands]
sync = { run = "mise run sync-branch" }

[post-merge.commands]
sync = { run = "mise run sync-branch" }
